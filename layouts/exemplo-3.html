<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Exemplo 3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #0c0c0f;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: #16161a;
      padding: 50px 40px;
      border-radius: 16px;
      max-width: 460px;
      border: 1px solid #27272a;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    h1 { 
      margin-bottom: 14px; 
      font-size: 1.85rem;
      background: linear-gradient(to right, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { color: #94a3b8; margin-bottom: 30px; line-height: 1.65; }
    a {
      display: inline-block;
      background: transparent;
      color: #a78bfa;
      padding: 10px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      border: 1px solid #7c5cfc;
      transition: all 0.2s;
    }
    a:hover { 
      background: #7c5cfc; 
      color: white;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Layout Exemplo 3</h1>
    <p>Este também é só um exemplo. Coloque seus arquivos HTML reais nesta pasta e atualize os cards no index.html.</p>
    <a href="../index.html">← Voltar para a galeria</a>
  </div>
</body>
</html>
