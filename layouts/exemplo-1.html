<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Exemplo 1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      max-width: 500px;
      border: 1px solid #334155;
    }
    h1 { margin-bottom: 12px; font-size: 1.8rem; }
    p { color: #94a3b8; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: #7c5cfc;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { background: #6a4de0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Layout Exemplo 1</h1>
    <p>Este é um arquivo de exemplo. Substitua este conteúdo pelo seu HTML real.</p>
    <a href="../index.html">← Voltar para a galeria</a>
  </div>
</body>
</html>
