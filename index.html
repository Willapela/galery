<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Layouts HTML</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background"></div>

  <header>
    <div class="container">
      <h1>Meus Layouts</h1>
      <p class="subtitle">Galeria de layouts HTML prontos para visualizar</p>
    </div>
  </header>

  <main class="container">
    <section class="gallery">
      
      <!-- Card DSPEEDV5 -->
      <a href="layouts/layout-dt-1.html" class="card" target="_blank">
        <div class="card-preview">
          <div class="preview-placeholder">DSPEEDV5</div>
        </div>
        <div class="card-content">
          <h2>DSPEEDV5</h2>
          <p>Interface estilo mangá para VPN / conexão.</p>
          <span class="badge">App UI</span>
        </div>
      </a>

      <!-- Card - Adicionar novo -->
      <a href="upload.html" class="card card-empty">
        <div class="card-preview empty">
          <div class="plus">+</div>
        </div>
        <div class="card-content">
          <h2>Adicionar novo</h2>
          <p>Clique aqui para enviar um HTML pelo site</p>
        </div>
      </a>

    </section>
  </main>

  <footer>
    <div class="container">
      <p>Feito com ❤️ • Pronto para hospedar no Netlify, Vercel ou GitHub Pages</p>
    </div>
  </footer>

</body>
</html>
