<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Exemplo 2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      padding: 48px 40px;
      border-radius: 20px;
      max-width: 480px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 { margin-bottom: 12px; font-size: 1.9rem; }
    p { color: #94a3b8; margin-bottom: 28px; line-height: 1.6; }
    a {
      display: inline-block;
      background: #7c5cfc;
      color: white;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 500;
      transition: transform 0.2s;
    }
    a:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="box">
    <h1>Layout Exemplo 2</h1>
    <p>Mais um exemplo. Troque este arquivo pelo seu layout real na pasta <strong>layouts/</strong>.</p>
    <a href="../index.html">← Voltar para a galeria</a>
  </div>
</body>
</html>
